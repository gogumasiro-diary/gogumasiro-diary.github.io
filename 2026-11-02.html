<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff7e9"><title>당신의 내일을 응원합니다 · 시집살이일기</title><style>*{box-sizing:border-box}body{margin:0;background:#fff9ef;color:#35291e;font-family:system-ui,'Malgun Gothic',sans-serif}main{max-width:560px;margin:auto;padding:28px 20px 40px}header{text-align:center}small{color:#775c3f;font-weight:700;font-size:16px}h1{font-size:29px;line-height:1.4}p{font-size:19px;line-height:1.65}.card{display:block;width:100%;height:auto;border-radius:16px;box-shadow:0 8px 28px #5639161a}nav{display:grid;gap:12px;margin:22px 0}button,.button{display:block;width:100%;padding:19px 12px;border-radius:14px;font-size:22px;font-weight:750;text-align:center;text-decoration:none;border:0;cursor:pointer;font-family:inherit}.save{background:#754621;color:white}.share{background:#fee500;color:#302717}.help{font-size:17px;color:#695847}.channel{display:block;text-align:center;color:#694728;font-size:18px;padding:16px}footer{text-align:center;font-size:15px;color:#86745f}button:focus-visible,a:focus-visible{outline:4px solid #3379ce;outline-offset:4px}#status{font-size:18px;background:#fff0d7;border-radius:12px;padding:14px;display:none}</style><main><header><small>시집살이일기 · 마음을 전하는 카드</small><h1>당신의 내일을 응원합니다</h1><p>소중한 분께<br>따뜻한 마음을 전해보세요.</p></header><a href="card-2026-11-02.png" aria-label="카드 원본 크게 보기"><img class="card" src="card-2026-11-02.png" alt="걸어온 날들에 박수를, 걸어갈 날들에 꽃길을. 당신의 내일을 응원합니다."></a><nav aria-label="카드 저장과 공유"><a class="button save" href="card-2026-11-02.png" download="시집살이일기-당신의내일.png" id="save">사진 저장하기</a><button class="share" id="share">카카오톡 등으로 보내기</button></nav><p id="status" role="status" aria-live="polite"></p><p class="help">저장한 사진이 갤러리에 보이지 않나요?<br>‘내 파일’ 앱의 ‘다운로드’에서 확인해 주세요.<br>저장 버튼이 작동하지 않으면 카드를 눌러 크게 연 뒤, 사진을 꾹 눌러 저장해 보세요.</p><a class="channel" href="https://www.youtube.com/channel/UCPYk6dVnF3ykUzg-UdCtexw">▶ 유튜브 시집살이일기 보러 가기</a><footer>카드는 소중한 분들과 자유롭게 나누세요.</footer></main><script>
const status=document.getElementById('status');function say(text){status.textContent=text;status.style.display='block'}
document.getElementById('save').addEventListener('click',()=>say('사진 저장을 요청했어요. 저장이 끝나면 갤러리 또는 내 파일 → 다운로드에서 확인해 주세요.'));
document.getElementById('share').addEventListener('click',async()=>{const button=document.getElementById('share');button.disabled=true;try{if(!navigator.share){say('이 브라우저에서는 바로 보내기를 지원하지 않아요. 사진을 저장한 뒤 카카오톡에서 보내주세요.');return}const response=await fetch('card-2026-11-02.png');if(!response.ok)throw new Error('image');const file=new File([await response.blob()],'따뜻한-안부.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]})}else{say('이 브라우저에서는 사진 바로 보내기를 지원하지 않아요. 사진을 저장한 뒤 카카오톡에서 보내주세요.')}}catch(error){if(error.name!=='AbortError')say('사진을 보내지 못했어요. 사진을 저장한 뒤 카카오톡에서 보내주세요.')}finally{button.disabled=false}});
</script></html>
