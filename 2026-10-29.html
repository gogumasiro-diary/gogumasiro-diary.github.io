<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>좋은 아침입니다 · 시집살이일기</title><style>*{box-sizing:border-box}body{margin:0;background:#fff9ef;color:#35291e;font-family:system-ui,sans-serif}main{max-width:560px;margin:auto;padding:26px 20px}h1{text-align:center;font-size:29px}p{font-size:18px;line-height:1.7}img{width:100%;height:auto;border-radius:16px}a.button,button{display:block;width:100%;padding:20px 10px;margin:14px 0;border:0;border-radius:14px;text-align:center;text-decoration:none;font-size:23px;font-weight:700;background:#754621;color:white}button{background:#fee500;color:#302717;cursor:pointer}.channel{display:block;text-align:center;color:#694728;padding:20px;font-size:18px}#status{background:#fff0d7;border-radius:10px;padding:12px;display:none}</style><main><h1>좋은 아침입니다 🌼</h1><p>소중한 분께 밝은 아침 인사를 전해보세요.</p><a class="button" href="exec-b0d7c1f7-6ca7-4991-8e9e-fcfce992d764.png" download="시집살이일기-2026-10-29.png" id="save">사진 저장하기</a><a href="exec-b0d7c1f7-6ca7-4991-8e9e-fcfce992d764.png" aria-label="카드 원본 크게 보기"><img src="exec-b0d7c1f7-6ca7-4991-8e9e-fcfce992d764.png" alt="좋은 아침입니다. 꽃은 작은 햇살에도 환하게 웃습니다. 우리도 오늘은 작은 기쁨 하나에 마음을 열어보아요. 반가운 인사 한마디, 따뜻한 눈길 한 번이 하루를 꽃피웁니다. 당신의 오늘도 웃음으로 피어나길 바랍니다."></a><a class="button" href="exec-b0d7c1f7-6ca7-4991-8e9e-fcfce992d764.png" download="시집살이일기-2026-10-29.png">사진 저장하기</a><button id="share">카카오톡 등으로 보내기</button><p id="status" role="status"></p><p>저장한 사진이 갤러리에 보이지 않으면 ‘내 파일 → 다운로드’에서 확인해 주세요.<br>버튼이 작동하지 않으면 카드를 눌러 크게 연 뒤 사진을 꾹 눌러 저장해 보세요.</p><a class="channel" href="https://www.youtube.com/channel/UCPYk6dVnF3ykUzg-UdCtexw">▶ 유튜브 시집살이일기 보러 가기</a><p>카드는 소중한 분들과 자유롭게 나누세요.</p></main><script>const status=document.getElementById("status");function say(t){status.textContent=t;status.style.display="block"}document.getElementById("share").onclick=async()=>{try{if(!navigator.share){say("사진을 저장한 뒤 카카오톡에서 보내주세요.");return}const r=await fetch("exec-b0d7c1f7-6ca7-4991-8e9e-fcfce992d764.png");if(!r.ok)throw Error();const f=new File([await r.blob()],"좋은-아침.png",{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else say("사진을 저장한 뒤 카카오톡에서 보내주세요.")}catch(e){if(e.name!=="AbortError")say("사진을 저장한 뒤 카카오톡에서 보내주세요.")}};</script></html>
